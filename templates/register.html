{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>{{'إنشاء حساب' if lang=='ar' else 'יצירת חשבון'}}</h1><p class="hint">{{'للتجربة فقط. لا تدخلوا معلومات طلاب حقيقية قبل الموافقة المؤسسية.' if lang=='ar' else 'לבדיקות בלבד. אין להזין מידע אישי של תלמידים אמיתיים לפני אישור מוסדי.'}}</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>{{'الاسم' if lang=='ar' else 'שם'}}<input name="name" required maxlength="100"></label><label>Email<input type="email" name="email" required></label><label>{{'كلمة المرور (10 أحرف على الأقل)' if lang=='ar' else 'סיסמה (10 תווים לפחות)'}}<input type="password" name="password" minlength="10" required></label><label>{{'الدور' if lang=='ar' else 'תפקיד'}}<select name="role"><option value="student">{{'طالب' if lang=='ar' else 'תלמיד'}}</option><option value="teacher">{{'معلم' if lang=='ar' else 'מורה'}}</option></select></label><label>{{'بريد المعلم (للطلاب)' if lang=='ar' else 'דוא״ל המורה (לתלמידים)'}}<input type="email" name="teacher_email"></label><label>{{'رمز دعوة المعلم (للمعلمين)' if lang=='ar' else 'קוד הזמנת מורה (למורים)'}}<input name="invite_code"></label><button>{{'إنشاء حساب' if lang=='ar' else 'הרשמה'}}</button></form></section>{% endblock %}
